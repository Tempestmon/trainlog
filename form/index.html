<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="referrer" content="no-referrer">
  <title>Trainlog</title>
  <style>
    :root {
      --bg: #f4f2ee;
      --surface: #ffffff;
      --ink: #1b1d21;
      --muted: #6b6f78;
      --line: #e2dfd8;
      --accent: #c2410c;
      --accent-ink: #ffffff;
      --ok: #15803d;
      --err: #b91c1c;
      --radius: 12px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --surface: #1d2026;
        --ink: #eceae6;
        --muted: #9a9ea8;
        --line: #2c3038;
        --accent: #fb923c;
        --accent-ink: #1b1d21;
        --ok: #4ade80;
        --err: #f87171;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
    }
    main { max-width: 560px; margin: 0 auto; padding: 0 16px 96px; }
    nav {
      position: sticky; top: 0; z-index: 2;
      display: flex; gap: 4px; padding: 12px 16px;
      background: var(--bg); border-bottom: 1px solid var(--line);
      max-width: 560px; margin: 0 auto;
    }
    .tab {
      flex: 1; padding: 10px 8px; border: 0; border-radius: 8px;
      background: transparent; color: var(--muted); font: inherit; font-weight: 600;
    }
    .tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
    input {
      width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); color: var(--ink); font: inherit; font-size: 17px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    .row { display: flex; gap: 8px; align-items: end; }
    .row > * { flex: 1; }
    .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button {
      flex: 1; padding: 12px; border: 0; background: var(--surface); color: var(--ink); font: inherit;
    }
    .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
    .chips { display: grid; gap: 8px; }
    .chip {
      text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); color: var(--ink); font: inherit; font-weight: 600;
    }
    .chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .exercise {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px; margin-top: 12px;
    }
    .exercise header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .exercise h3 { margin: 0; font-size: 17px; }
    .target { color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .note { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .hint { margin: 6px 0 10px; font-size: 14px; color: var(--accent); }
    .set {
      display: grid; grid-template-columns: 22px 1fr 1fr 1fr 36px; gap: 6px; align-items: center; margin-top: 6px;
    }
    .set.head { font-size: 12px; color: var(--muted); margin-top: 0; }
    .set input { padding: 10px 8px; text-align: center; font-variant-numeric: tabular-nums; }
    .set-no { color: var(--muted); font-size: 14px; text-align: center; }
    .icon {
      height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 22px;
    }
    .add {
      margin-top: 8px; padding: 8px 0; border: 0; background: transparent; color: var(--accent); font: inherit; font-weight: 600;
    }
    .primary {
      width: 100%; margin-top: 16px; padding: 15px; border: 0; border-radius: var(--radius);
      background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; font-size: 17px;
    }
    .sticky { position: sticky; bottom: 12px; }
    .primary:disabled { opacity: .6; }
    .status { min-height: 1.4em; margin: 10px 0 0; font-size: 14px; color: var(--muted); }
    .status[data-kind="ok"] { color: var(--ok); }
    .status[data-kind="error"] { color: var(--err); }
    .help { font-size: 13px; color: var(--muted); }
    .help code { font-size: 12px; }
  </style>
</head>
<body>
  <nav role="tablist">
    <button class="tab" role="tab" data-tab="workout" aria-selected="true">Тренировка</button>
    <button class="tab" role="tab" data-tab="body" aria-selected="false">Вес</button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">Настройки</button>
  </nav>

  <main>
    <section class="panel" id="panel-workout">
      <div class="row">
        <div>
          <label for="date">Дата</label>
          <input id="date" type="date">
        </div>
        <div>
          <label>Дней в неделю</label>
          <div class="seg" id="variant">
            <button type="button" data-variant="3" aria-pressed="true">3</button>
            <button type="button" data-variant="4" aria-pressed="false">4</button>
          </div>
        </div>
      </div>
      <h2>Тренировка</h2>
      <div class="chips" id="sessions"></div>
      <div id="exercises"></div>
      <div class="sticky">
        <button class="primary" id="save-workout" type="button" hidden>Сохранить тренировку</button>
      </div>
      <p class="status" id="workout-status" role="status"></p>
    </section>

    <section class="panel" id="panel-body" hidden>
      <h2>Утреннее взвешивание</h2>
      <label for="b-date">Дата</label>
      <input id="b-date" type="date">
      <div class="row">
        <div>
          <label for="b-weight">Вес, кг</label>
          <input id="b-weight" type="number" inputmode="decimal" step="0.1">
        </div>
        <div>
          <label for="b-waist">Талия, см</label>
          <input id="b-waist" type="number" inputmode="decimal" step="0.5" placeholder="раз в неделю">
        </div>
      </div>
      <label for="b-sleep">Сон, ч</label>
      <input id="b-sleep" type="number" inputmode="decimal" step="0.5">
      <label for="b-note">Заметка</label>
      <input id="b-note" type="text" placeholder="дежурство, болел, …">
      <button class="primary" id="save-body" type="button">Сохранить</button>
      <p class="status" id="body-status" role="status"></p>
    </section>

    <section class="panel" id="panel-settings" hidden>
      <h2>Репозиторий</h2>
      <label for="s-owner">Владелец</label>
      <input id="s-owner" type="text" autocapitalize="off" autocomplete="off" spellcheck="false">
      <label for="s-repo">Репозиторий</label>
      <input id="s-repo" type="text" autocapitalize="off" autocomplete="off" spellcheck="false">
      <label for="s-branch">Ветка</label>
      <input id="s-branch" type="text" autocapitalize="off" autocomplete="off" spellcheck="false">
      <label for="s-api">API</label>
      <input id="s-api" type="url" autocapitalize="off" autocomplete="off" spellcheck="false">
      <label for="s-token">Токен</label>
      <input id="s-token" type="password" autocomplete="off">
      <p class="help">Fine-grained token: доступ только к этому репозиторию, <code>Contents: Read and write</code>.
        Хранится только в этом браузере.</p>
      <button class="primary" id="save-settings" type="button">Сохранить и проверить</button>
      <p class="status" id="settings-status" role="status"></p>
    </section>
  </main>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
