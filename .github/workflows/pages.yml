name: pages

# Publishes the static form. Requires Settings -> Pages -> Source: GitHub Actions.
# GitHub Pages needs a public repo on the free plan (see README).

on:
  push:
    branches: [main]
    paths: ["form/*.html", "form/*.js"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: mkdir _site && cp form/index.html form/logic.js form/app.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
